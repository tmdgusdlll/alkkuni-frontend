# build(린트·빌드, 타입 검사 포함)는 PR·main 푸시 모두, deploy는 main 푸시에서 build가 성공했을 때만 돈다(백엔드 ci-cd.yml과 같은 구조).
# job 이름 build는 main 브랜치 보호의 필수 상태 검사 이름이다(백엔드와 같음). 바꾸면 보호 설정도 같이 바꾼다.
# AWS 권한(id-token: write)은 deploy job에만 준다. IAM 역할 alkkuni-web-deploy의 신뢰 정책은 이 레포 main만 받는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR은 새 커밋이 오면 이전 실행을 버린다. main은 배포 중에 끊기면 서버가 어중간한 상태로 남아서 취소하지 않는다.
# main 실행은 이 그룹으로 한 번에 하나씩 돌아 배포가 겹치지 않는다(대기는 최신 하나만 남는다).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 빌드만 하므로 토큰을 .git/config에 남기지 않는다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # 백엔드 없이 통과한다. API 호출은 searchParams·params를 읽은 뒤라 prerender 때 실행되지 않는다(2026-11-11 확인)
      # Dockerfile도 같은 next build를 하므로 이 조건이 깨지면 이미지 빌드도 깨진다.
      - run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # t4g(ARM)용 이미지를 QEMU 없이 네이티브로 빌드한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # AWS 자격 증명을 다루는 서드파티 액션은 커밋 SHA로 고정한다(태그는 옮겨질 수 있다). 올릴 때 SHA와 주석을 같이 바꾼다. 백엔드와 같은 버전.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # 태그는 sha(롤백용)와 latest. provenance를 끄는 이유: 증명 매니페스트도 ECR 수명 주기의 "이미지 10개"에 세어진다.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/alkkuni-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/alkkuni-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # EC2에서 이 커밋의 deploy-web.sh를 받아 실행한다(SSH 없이 SSM 에이전트가 실행). 헬스 체크까지 EC2 안에서 한다.
      - name: EC2에 배포
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          # AWS-RunShellScript는 /bin/sh로 돈다. deploy-web.sh는 bash로 부른다.
          params=$(jq -n --arg c "set -eu
          mkdir -p /opt/alkkuni/web
          curl -fsSL $RAW_BASE/deploy/deploy-web.sh -o /opt/alkkuni/web/deploy-web.sh
          bash /opt/alkkuni/web/deploy-web.sh $SHA" '{commands: [$c], executionTimeout: ["300"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy web $SHA" --parameters "$params" --query Command.CommandId --output text)
          # aws ssm wait는 약 100초에서 끝나 기다리는 시간을 직접 정한다(최대 5분).
          for _ in $(seq 60); do
            sleep 5
            # 명령을 보낸 직후엔 InvocationDoesNotExist가 난다. 그 외 오류(권한 등)는 숨기지 않고 바로 실패한다.
            if ! status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>&1); then
              case "$status" in *InvocationDoesNotExist*) continue ;; esac
              echo "$status" >&2
              exit 1
            fi
            case "$status" in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "SSM 상태: $status"
          test "$status" = Success
